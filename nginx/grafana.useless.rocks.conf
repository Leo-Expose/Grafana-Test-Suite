# Place this file at /etc/nginx/sites-available/grafana.useless.rocks on the host
# Then run:
#   sudo ln -s /etc/nginx/sites-available/grafana.useless.rocks /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d grafana.useless.rocks

server {
    listen 80;
    server_name grafana.useless.rocks;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
